# Preference tuning (DPO) settings. dpo.sh reads this; dpo_train.py explains
# how the training works.
model: mlx-community/Meta-Llama-3.1-8B-4bit
start_adapter: adapters/prose-v3      # the add-on to start from; it's also the reference
adapter_path: adapters/prose-v3-dpo   # where the new add-on goes
pairs: prefs/pairs.jsonl              # your picks from the playground's Compare mode

beta: 0.1                   # the leash: how much a reply's score has to change to count.
                            # Lower lets the model move further from the start.
# How far training moves the model is roughly learning_rate x number of updates,
# and updates = epochs x pairs / pairs_per_update. These suit about 50 pairs
# (3 x 43 / 4 = about 33 updates). For 150 pairs, 1e-5 and 2 epochs give about
# the same total.
learning_rate: 2e-5         # step size per update; SFT used 4e-5
epochs: 3                   # passes over the pairs; each pass also saves epochN_adapters.safetensors
pairs_per_update: 4         # pairs averaged into each nudge
valid_fraction: 0.1         # share of pairs held out to check against (with 10 or more)
max_seq_length: 1024        # longer prompt + reply are cut to this many tokens
grad_checkpoint: true       # saves memory at some cost in speed
seed: 0
