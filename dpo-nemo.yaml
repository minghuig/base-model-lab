# Preference tuning (DPO) for the Nemo add-on. Same method and settings as
# dpo.yaml, starting from nemo-prose-v2 (run 7). Run it with:
#   bash ~/Documents/base-model-lab/dpo.sh --config dpo-nemo.yaml
# It trains only on pairs nemo-prose-v2 wrote: collect them in the playground's
# Compare mode with Mistral Nemo and the nemo-prose-v2 add-on selected.
model: mlx-community/Mistral-Nemo-Base-2407-4bit
start_adapter: adapters/nemo-prose-v2      # the add-on to start from; it's also the reference
adapter_path: adapters/nemo-prose-v2-dpo   # where the new add-on goes
pairs: prefs/pairs.jsonl                   # your picks from Compare mode, all models together
only_start_pairs: true                     # use only pairs the starting add-on wrote

beta: 0.1                   # the leash: how much a reply's score has to change to count.
                            # Lower lets the model move further from the start.
# How far training moves the model is roughly learning_rate x number of updates,
# and updates = epochs x pairs / pairs_per_update. DPO run 1 on Llama (2e-5, 3
# epochs of 11 updates) went far too far (runs/README.md). 5e-6 for one epoch
# suits about 50 pairs: 11 updates, a quarter of run 1's first epoch. With about
# 100 pairs, use 2.5e-6 to keep learning_rate x updates the same.
learning_rate: 5e-6         # step size per update
epochs: 1                   # passes over the pairs; each pass also saves epochN_adapters.safetensors
pairs_per_update: 4         # pairs averaged into each nudge
valid_fraction: 0.1         # share of pairs held out to check against (with 10 or more)
max_seq_length: 1024        # longer prompt + reply are cut to this many tokens
grad_checkpoint: true       # saves memory at some cost in speed
seed: 0
